# ==========================================================
# 1. REDIRECCIÓN HTTP -> HTTPS
# ==========================================================
# Redirige permanentemente todo el tráfico del puerto 80 al 443.
server {
    listen 80;
    server_name edupi.daw.inspedralbes.cat api.edupi.daw.inspedralbes.cat;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================
# 2. SERVIDOR HTTPS PRINCIPAL (Frontend y API)
# ==========================================================
server {
    listen 443 ssl http2;
    server_name edupi.daw.inspedralbes.cat;

    # --- Configuración SSL ---
    # DEBES REEMPLAZAR ESTOS ARCHIVOS CON TUS CERTIFICADOS
    # Colócalos en la carpeta /nginx/certs
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # --- Parámetros de seguridad SSL (Recomendados) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    # --- Proxy al Frontend ---
    location / {
        # El header COOP necesita un entorno seguro (HTTPS) para funcionar
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups;
        
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Proxy al Backend ---
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==========================================================
# 3. SERVIDOR HTTPS PARA SUBDOMINIO API (Opcional pero recomendado)
# ==========================================================
server {
    listen 443 ssl http2;
    server_name api.edupi.daw.inspedralbes.cat;

    # --- Configuración SSL ---
    # Apunta a los mismos certificados que el dominio principal
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- Proxy al Backend ---
    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}