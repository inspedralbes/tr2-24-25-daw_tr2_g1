# Fichero: docker-compose.yml
# Descripción: Configuración de Docker Compose para el entorno de desarrollo
# del proyecto PlaPI. Incluye frontend (Vue/Vite), backend (Node/Express),
# MySQL y Adminer, con hot-reloading configurado para el desarrollo.
#
# Para levantar este entorno, se debe usar el comando:
# docker compose up --build

services:
  # ----------------------------------------
  # 1. Servicio del frontend (PlaPI Nuxt)
  # ----------------------------------------
  frontend:
    container_name: plapi_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "3001:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - plapi-network

  # ----------------------------------------
  # 2. Servicio del backend (PlaPI Node.js/Express)
  # ----------------------------------------
  backend:
    container_name: plapi_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_USER: user_dev
      DB_PASSWORD: password_dev
      DB_NAME: db_plapi_dev
      DB_PORT: 3306
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - plapi-network

  # ----------------------------------------
  # 3. Servicio de la base de datos MySQL
  # ----------------------------------------
  mysql:
    container_name: plapi_mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: db_plapi_dev
      MYSQL_USER: user_dev
      MYSQL_PASSWORD: password_dev
    volumes:
      # Persistencia de los datos
      - plapi-mysql-data:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plapi-network

  # ----------------------------------------
  # 4. Servicio Adminer para gestión de bases de datos
  # ----------------------------------------
  adminer:
    container_name: plapi_adminer
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      # Conexión al servicio MySQL
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - plapi-network

  # ----------------------------------------
  # 5. Servicio phpMyAdmin
  # ----------------------------------------
  phpmyadmin:
    container_name: plapi_phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - plapi-network
# ----------------------------------------
# Definición de la red y volúmenes
# ----------------------------------------
networks:
  plapi-network:
    driver: bridge

volumes:
  plapi-mysql-data:
