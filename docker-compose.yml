# Fichero: docker-compose.yml
# Descripción: Configuración de Docker Compose para el entorno de desarrollo
# del proyecto PlaPI. Incluye frontend (Vue/Vite), backend (Node/Express),
# MySQL y Adminer, con hot-reloading configurado para el desarrollo.
#
# Para levantar este entorno, se debe usar el comando:
# docker compose up --build

services:
  # ----------------------------------------
  # 1. Servicio del frontend (PlaPI Vue/Vite)
  # ----------------------------------------
  frontend:
    container_name: plapi_frontend
    build:
      # Contexto: La carpeta 'front' donde está el código
      context: ./front
      dockerfile: Dockerfile
    environment:
      # Configuración específica de desarrollo
      VITE_NODE_ENV: development
      # Conexión al backend usando el nombre del servicio 'backend'
      VITE_SOCKET_URL: http://backend:3000 
    ports:
      - "5173:3000" # Puerto de desarrollo de nuxt
    volumes:
      # Monta el código fuente de 'front' para hot-reloading
      - ./front:/app 
      # Volumen anónimo para preservar node_modules del contenedor
      - /app/node_modules 
    # Asegúrate de que tu package.json en 'front' tenga un script 'dev'
    command: sh -c "npm install && npm run dev"
    networks:
      - plapi-network

  # ----------------------------------------
  # 2. Servicio del backend (PlaPI Node.js/Express)
  # ----------------------------------------
  backend:
    container_name: plapi_backend
    build:
      # Contexto: La carpeta 'back' donde está el código
      context: ./back 
      dockerfile: Dockerfile
    environment:
      # Configuración de desarrollo
      NODE_ENV: development
      # El host de la DB es el nombre del servicio: 'mysql'
      DB_HOST: mysql 
      # Otras variables que necesite tu backend
      DB_USER: user_dev
      DB_PASSWORD: password_dev
    ports:
      # Puerto del backend
      - "3000:3000"
    volumes:
      # Monta el código fuente de 'back' para hot-reloading (nodemon)
      - ./back:/usr/src/app 
      # Evita sobreescribir node_modules del contenedor
      - /usr/src/app/node_modules 
    # Comando para iniciar el servidor de desarrollo (nodemon o similar)
    # Asegúrate de que tu package.json en 'back' tenga un script 'dev'
    command: sh -c "npm install && npm run dev" 
    depends_on:
      # Espera a que MySQL esté saludable antes de iniciar el backend
      mysql:
        condition: service_healthy
    networks:
      - plapi-network

  # ----------------------------------------
  # 3. Servicio de la base de datos MySQL
  # ----------------------------------------
  mysql:
    container_name: plapi_mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_plapi_dev
      MYSQL_USER: user_dev
      MYSQL_PASSWORD: password_dev
    volumes:
      # Persistencia de los datos
      - plapi-mysql-data:/var/lib/mysql 
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plapi-network

  # ----------------------------------------
  # 4. Servicio Adminer para gestión de bases de datos
  # ----------------------------------------
  adminer:
    container_name: plapi_adminer
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      # Conexión al servicio MySQL
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - plapi-network


  # ----------------------------------------
  # 5. Servicio phpMyAdmin
  # ----------------------------------------
  phpmyadmin:
    container_name: plapi_phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - plapi-network

# ----------------------------------------
# Definición de la red y volúmenes
# ----------------------------------------
networks:
  plapi-network:
    driver: bridge

volumes:
  plapi-mysql-data: