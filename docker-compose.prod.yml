# Fichero: docker-compose.prod.yml
# Descripción: Configuración de Docker Compose para PRODUCCIÓN.
# Utiliza las imágenes construidas en GitHub Actions y almacenadas en GHCR.

services:
  # ----------------------------------------
  # 1. Frontend (Producción)
  # ----------------------------------------
  frontend:
    container_name: plapi_frontend_prod
    # Usa la imagen construida en el workflow. ${GITHUB_REPOSITORY} se llena desde el .env generado
    image: ghcr.io/${GITHUB_REPOSITORY}-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - GEMINI_KEY=${VITE_GEMINI_KEY}
    expose:
      - "3000" # Exponemos el puerto interno de Nuxt para que Nginx lo vea
    depends_on:
      - backend
    networks:
      - plapi-network

  # ----------------------------------------
  # 2. Backend (Producción)
  # ----------------------------------------
  backend:
    container_name: plapi_backend_prod
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DB_HOST: plapi_mysql_prod
      # Estas variables se leen del archivo .env generado por el workflow
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # URL del frontend para CORS si es necesario
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - plapi-network

  # ----------------------------------------
  # 3. Base de Datos MySQL (Producción)
  # ----------------------------------------
  mysql:
    container_name: plapi_mysql_prod
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plapi-mysql-data-prod:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plapi-network

  # ----------------------------------------
  # 4. Nginx (Proxy Inverso / Gateway)
  # ----------------------------------------
  nginx:
    container_name: plapi_nginx_prod
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - plapi-network

networks:
  plapi-network:
    driver: bridge

volumes:
  plapi-mysql-data-prod:
