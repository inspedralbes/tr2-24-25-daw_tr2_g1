services:
  - type: web
    name: plapi-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: demo/free-hosting
    dockerfilePath: ./Dockerfile.demo
    healthCheckPath: /up
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DB_NAME
        value: plapi_demo
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
